project_id = "preach"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "preach://"
additional_redirect_urls = ["preach://reset-password", "preach://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so `npm run seed` can create usable accounts without a mail round
# trip. Turn this ON in the hosted project.
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"
# Native Google sign-in sends an ID token whose audience is the platform client
# id, not the web client id, so those must be accepted as well.
skip_nonce_check = true

[analytics]
enabled = false

# Called by Postgres triggers with the service-role key rather than a user JWT,
# so the gateway's JWT check has to be off. The function verifies the key.
[functions.send-push]
verify_jwt = false

[functions.bible-proxy]
verify_jwt = true

[functions.embed-query]
verify_jwt = true

[functions.create-room-token]
verify_jwt = true
